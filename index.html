<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snow Day · Build a Snowman — WebGPU</title>
<meta name="description" content="A quiet place to play in the snow. Push it around by hand, press snowmen and castle walls out of molds, leave tracks across a winter valley — live on WebGPU." />
<meta name="theme-color" content="#CBC3D3" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Snow Day · Build a Snowman" />
<meta property="og:description" content="A quiet place to play in the snow. Press snowmen, towers and castle walls out of molds and leave tracks across a winter valley — running live on WebGPU." />
<meta property="og:image" content="/assets/og-snowday.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1920" />
<meta property="og:image:height" content="1080" />
<meta property="og:image:alt" content="A soft pastel snowfield with pines, rocks and a mound of packed snow, under the sparkling words Snow Day." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="/assets/og-snowday.jpg" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="assets/title.png" as="image" />
<style>
  :root{
    /* 取自 OG 图：粉橘的日光、薰衣草色的天、冰蓝的阴影 */
    --coral:#E8907E;
    --coral-deep:#C9624D;
    --blue:#4D74C4;
    --blue-soft:#6F8FD0;
    --snow:#FFFFFF;
    --ink:#3A3550;
    --lav:#CFC6D6;

    --glass:linear-gradient(160deg,rgba(255,246,244,.44),rgba(232,228,244,.30));
    --glass-line:rgba(255,255,255,.50);
    --glow:0 1px 8px rgba(70,58,100,.30);

    --mono:'DM Mono', ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', 'Microsoft YaHei', monospace;
    --serif:'Cormorant SC', 'Songti SC', 'Noto Serif SC', 'SimSun', serif;

    --line:rgba(255,255,255,.72);
    --ui-right:clamp(14px,2.8vw,54px);
    --ui-top:clamp(14px,6vh,64px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  button,[role=button],input[type=range],a,.ld-tilt{cursor:pointer}
  body{
    margin:0;background:var(--lav);color:var(--snow);overflow:hidden;
    font-family:var(--mono);font-size:12px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:default}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------------------------------------------------------- 左上 */
  #topleft{
    position:fixed;left:clamp(22px,4.6vw,90px);top:clamp(20px,4vw,74px);z-index:20;pointer-events:none;
    display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    text-transform:uppercase;text-shadow:var(--glow);
  }
  #topleft .sub{font-size:13px;font-weight:500;letter-spacing:.2em}
  #stats{font-size:12px;letter-spacing:.17em;opacity:.9;font-variant-numeric:tabular-nums}

  /* ---------------------------------------------------------- 左下 */
  #bottomleft{
    position:fixed;left:clamp(18px,3vw,56px);bottom:clamp(14px,2.6vw,44px);z-index:20;pointer-events:none;
  }
  #brand img{
    display:block;width:clamp(190px,15.5vw,300px);height:auto;
    filter:drop-shadow(0 2px 14px rgba(90,70,120,.25));
  }

  /* ---------------------------------------------------------- 操作说明面板（# 图标打开） */
  #help{
    position:fixed;right:var(--ui-right);top:var(--ui-top);width:350px;z-index:30;
    max-height:calc(100vh - 2 * var(--ui-top));overflow-y:auto;
    padding:22px 24px 22px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(22px) saturate(1.15);backdrop-filter:blur(22px) saturate(1.15);
    border:1px solid var(--glass-line);border-radius:24px;
    box-shadow:0 24px 60px rgba(70,58,100,.16), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .5s,visibility .5s;
  }
  #help.hidden{transform:translateX(calc(100% + 60px));opacity:0;visibility:hidden}
  #help .t{
    font-family:var(--serif);font-weight:500;font-size:40px;line-height:.9;
    text-shadow:var(--glow);margin:0 0 14px;padding-right:48px;
  }
  #hint{
    font-size:11.5px;letter-spacing:.05em;line-height:1.7;text-shadow:var(--glow);
    border-top:1px solid var(--coral);padding-top:12px;
  }
  #hint .hk{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:3px 0;border-bottom:1px solid rgba(255,255,255,.22)}
  #hint .hk:last-child{border-bottom:0}
  #hint .hk b{font-weight:400;text-align:right}
  #hint em{font-style:normal;font-weight:500;text-transform:uppercase;letter-spacing:.11em;color:var(--blue);text-shadow:none}
  #hint kbd{
    display:inline-block;min-width:17px;text-align:center;padding:0 4px;margin:0 1px;
    border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:10px;line-height:1.5;
  }

  /* ---------------------------------------------------------- 控制面板 */
  #ui{
    position:fixed;right:var(--ui-right);top:var(--ui-top);bottom:clamp(14px,6vh,64px);
    width:350px;z-index:30;
    display:flex;flex-direction:column;
    background:var(--glass);
    -webkit-backdrop-filter:blur(22px) saturate(1.15);backdrop-filter:blur(22px) saturate(1.15);
    border:1px solid var(--glass-line);border-radius:24px;
    box-shadow:0 24px 60px rgba(70,58,100,.16), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .5s,visibility .5s;
  }
  #ui.hidden{transform:translateX(calc(100% + 60px));opacity:0;visibility:hidden}
  #ui header{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 72px 6px 24px;flex:none;
  }
  #ui header .t{
    font-family:var(--serif);font-weight:500;font-size:40px;line-height:.9;letter-spacing:.01em;
    color:var(--snow);text-shadow:var(--glow);
  }
  .hbtns{display:flex;align-items:center;gap:6px}

  #ui .body{overflow-y:auto;overscroll-behavior:contain;padding:0 24px 22px;flex:1}
  #ui .body::-webkit-scrollbar{width:4px}
  #ui .body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.6);border-radius:4px}
  #ui .body::-webkit-scrollbar-track{background:transparent}

  /* ---------------------------------------------------------- 分组 */
  .grp{margin-top:20px}
  .grp:first-child{margin-top:6px}
  .grp>h3{
    margin:0 0 10px;padding-bottom:4px;
    font-family:var(--mono);font-size:13px;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;color:var(--snow);text-shadow:var(--glow);
    border-bottom:1px solid var(--coral);
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    user-select:none;
  }
  .grp>h3:hover{color:#FFE3DA}
  .grp>h3:focus-visible{outline:1px solid var(--coral);outline-offset:2px}
  .grp>h3 .caret{
    font-style:normal;font-size:9px;letter-spacing:0;opacity:.55;
    transition:transform .18s;transform-origin:50% 45%;
  }
  .grp>h3:hover .caret{opacity:.95}
  /* 收起时只留标题，底边距一并收掉，免得留一条空档 */
  .grp.collapsed>h3{margin-bottom:0}
  .grp.collapsed>h3 .caret{transform:rotate(-90deg)}
  .grp.collapsed>*:not(h3){display:none}

  /* ---------------------------------------------------------- 滑杆 */
  .row{margin-bottom:8px}
  .row .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .row .lbl span{
    color:var(--blue);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row .lbl b{
    color:var(--blue);opacity:.85;font-weight:400;font-size:10.5px;letter-spacing:.08em;
    font-variant-numeric:tabular-nums;white-space:nowrap;text-transform:uppercase;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:13px;
    background:transparent;margin:1px 0 0;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
  input[type=range]::-moz-range-track{height:1px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:7px;height:7px;margin-top:-3px;
    background:var(--snow);border:0;border-radius:0;transition:transform .12s;
    box-shadow:0 0 6px rgba(232,144,126,.7);
  }
  input[type=range]::-moz-range-thumb{
    width:7px;height:7px;border:0;border-radius:0;background:var(--snow);
  }
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.4)}
  input[type=range]:focus-visible{outline:1px solid var(--coral);outline-offset:3px}

  /* ---------------------------------------------------------- 按钮 */
  .btns{display:grid;grid-template-columns:repeat(3,1fr)}
  .btns.two{grid-template-columns:repeat(2,1fr)}
  .btns button + button{margin-left:-1px}
  /* 折行的按钮组（手势 4 个、模具 6 个）：行与行之间也要并边框，
     而且每行第一个不能再往左缩，否则会顶出网格 */
  .btns.two button:nth-child(2n+1){margin-left:0}
  .btns.two button:nth-child(n+3){margin-top:-1px}
  .btns.grid6 button:nth-child(3n+1){margin-left:0}
  .btns.grid6 button:nth-child(n+4){margin-top:-1px}
  button{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--snow);background:transparent;border:1px solid rgba(232,144,126,.75);
    border-radius:0;padding:10px 3px 9px;text-shadow:var(--glow);
    transition:background .15s,border-color .15s,color .15s;
  }
  button:hover{background:rgba(255,255,255,.14)}
  button.on{
    border-color:var(--coral);background:rgba(255,222,210,.42);color:var(--snow);
    position:relative;z-index:1;
  }
  button .k{
    display:block;font-size:9px;letter-spacing:.1em;margin-top:3px;
    color:rgba(255,255,255,.62);
  }
  button.on .k{color:#FFE3DA}

  .iconbtn{
    width:28px;height:28px;padding:0;display:grid;place-items:center;
    font-size:12px;line-height:1;border:1.5px solid rgba(255,255,255,.85);color:var(--snow);
  }
  .iconbtn:hover{border-color:var(--coral)}
  .langbtn{width:auto;min-width:40px;padding:0 8px;font-size:10px;letter-spacing:.1em}

  /* ---------------------------------------------------------- 右上：# 操作说明 / 相机 / * 控制面板
     三个图标横排在右上角，没有底框。同一时间只开一样东西：
     开了哪个，另外两个图标就收起来，剩下的那个正好落在打开的面板右上角，
     再点它就是关。状态挂在 body[data-open] 上（ui.js 管）。 */
  #tools{
    position:fixed;right:calc(var(--ui-right) + 18px);top:calc(var(--ui-top) + 16px);z-index:75;
    display:flex;align-items:center;
    transition:opacity .8s ease .35s,visibility .8s;
  }
  .toolbtn{
    width:38px;height:38px;padding:0;margin-left:14px;display:grid;place-items:center;
    background:none;border:0;border-radius:0;text-shadow:none;overflow:hidden;
    transition:width .35s cubic-bezier(.2,.7,.2,1),margin .35s cubic-bezier(.2,.7,.2,1),opacity .25s;
  }
  /* 图标自带柔光，不再叠投影；也没有悬停效果 */
  .toolbtn img{width:34px;height:34px;display:block;pointer-events:none}
  .toolbtn:hover{background:none}
  .toolbtn:focus-visible{outline:1px solid var(--coral);outline-offset:2px}
  /* * 图标一直慢慢转 */
  .toolbtn[data-tool="panel"] img{animation:spin 24s linear infinite}
  /* 有东西开着：只留它自己的图标，其余两个收成 0 宽淡出 */
  body[data-open] .toolbtn{width:0;margin-left:0;opacity:0;pointer-events:none}
  body[data-open="help"] .toolbtn[data-tool="help"],
  body[data-open="photo"] .toolbtn[data-tool="photo"],
  body[data-open="panel"] .toolbtn[data-tool="panel"]{width:38px;margin-left:14px;opacity:1;pointer-events:auto}

  /* ---------------------------------------------------------- 落地页前后：HUD 藏起来 */
  #topleft,#bottomleft{transition:opacity .9s ease .25s,visibility .9s}
  body.landing #topleft,body.landing #bottomleft,body.landing #help,
  body.landing #ui,body.landing #tools{opacity:0;visibility:hidden;pointer-events:none}
  body.landing #ui{transform:translateX(40px)}

  /* ---------------------------------------------------------- 载入 */
  #boot{
    position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:
      radial-gradient(ellipse 80% 55% at 50% 0%,rgba(255,236,226,.9),transparent 70%),
      linear-gradient(180deg,#D9CCD6 0%,#E7DFE6 48%,#C3CCDF 100%);
    transition:opacity .9s ease, visibility .9s;
  }
  #boot.done{opacity:0;visibility:hidden}
  #boot p{
    margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--blue);
  }
  /* 一句话说清这是个什么地方 —— 加载那几秒是唯一有人会读字的时候 */
  #boot .blurb{
    max-width:480px;padding:0 24px;text-align:center;
    font-size:13px;line-height:1.9;letter-spacing:.03em;
    text-transform:none;color:var(--ink);opacity:.78;
  }
  .bar{width:196px;height:2px;background:rgba(255,255,255,.6);overflow:hidden;border-radius:2px}
  .bar i{display:block;height:100%;width:34%;background:var(--coral);animation:sweep 1.15s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
  #boot .err{
    display:none;max-width:520px;padding:0 24px;text-align:center;color:var(--coral-deep);
    font-family:var(--mono);font-size:12px;line-height:1.9;letter-spacing:.04em;text-transform:none;
  }
  /* 出错的时候只留报错，别让宣传语抢戏 */
  #boot.failed .bar,#boot.failed p.tip,#boot.failed .blurb{display:none}
  #boot.failed .err{display:block}

  /* ---------------------------------------------------------- 落地页（参考 OG 图） */
  #landing{
    position:fixed;inset:0;z-index:50;overflow:hidden;
    display:grid;place-items:center;
    transition:opacity 1.1s ease,visibility 1.1s;
  }
  #landing.gone{opacity:0;visibility:hidden;pointer-events:none}
  /* 四周一圈奶白的晕 —— OG 图边上那层雾气 */
  .ld-veil{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 70% 62% at 50% 55%,transparent 45%,rgba(246,240,246,.62) 100%),
      radial-gradient(ellipse 42% 30% at 50% 54%,rgba(96,82,130,.30),transparent 72%),
      linear-gradient(180deg,rgba(214,200,222,.10),rgba(120,110,160,.18));
  }
  /* 两道若有若无的光环，像镜头里的反光圈 */
  .ld-ring{
    position:absolute;left:50%;top:52%;pointer-events:none;
    border:1.5px solid rgba(255,255,255,.55);border-radius:50%;
    filter:blur(.6px) drop-shadow(0 0 6px rgba(255,210,220,.7));
  }
  .ld-ring.r1{width:132vmax;height:96vmax;transform:translate(-50%,-50%) rotate(-8deg);animation:drift1 26s ease-in-out infinite}
  .ld-ring.r2{width:118vmax;height:104vmax;transform:translate(-50%,-50%) rotate(12deg);opacity:.55;animation:drift2 32s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(-50%,-50%) rotate(-3deg) scale(1.02)}}
  @keyframes drift2{50%{transform:translate(-50%,-50%) rotate(17deg) scale(.98)}}

  .ld-center{
    position:relative;display:flex;flex-direction:column;align-items:center;
    gap:clamp(8px,3vh,36px);padding:0 16px;margin-top:4vh;
  }
  .ld-tilt{perspective:900px;will-change:transform}
  .ld-title{
    width:min(760px,82vw);height:auto;user-select:none;-webkit-user-drag:none;
    filter:drop-shadow(0 4px 30px rgba(110,90,140,.28));
    animation:titleIn 1.6s cubic-bezier(.2,.7,.2,1) both,float 7s ease-in-out 1.6s infinite;
  }
  @keyframes titleIn{from{opacity:0;transform:translateY(14px) scale(.97);filter:blur(10px)}}
  @keyframes float{50%{transform:translateY(-6px)}}
  /* 入场动画放完就只留浮动，免得摘掉 boing 时入场再放一遍 */
  .ld-title.ready{animation:float 7s ease-in-out infinite}
  .ld-title.boing{animation:boing .7s cubic-bezier(.3,1.6,.5,1)}
  @keyframes boing{0%{transform:scale(1)}30%{transform:scale(.94,1.05)}60%{transform:scale(1.05,.97)}100%{transform:scale(1)}}
  /* 点标题撒出来的小星星 */
  .ld-star{
    position:fixed;left:0;top:0;width:22px;height:22px;pointer-events:none;z-index:51;
    background:url(assets/snow.png) center/contain no-repeat;
    animation:starFly .9s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes starFly{
    from{transform:translate(var(--x0),var(--y0)) scale(.4) rotate(0);opacity:1}
    to{transform:translate(var(--x1),var(--y1)) scale(1) rotate(var(--r));opacity:0}
  }
  .ld-enter{width:clamp(170px,14vw,240px);animation:fadeUp 1.2s ease .7s both}

  /* ---------------------------------------------------------- 图片按钮
     常态 / 悬停各一张图叠在一起，悬停时交叉淡入 —— 没有放大、没有变色，别的效果一概不要。
     .done 让它停在悬停那张上（「已保存」的反馈用） */
  .imgbtn{position:relative;display:block;border:0;background:none;padding:0;text-shadow:none}
  .imgbtn:hover{background:none}
  .imgbtn:focus{outline:none}
  .imgbtn img{display:block;width:100%;height:auto;pointer-events:none;transition:opacity .35s ease}
  .imgbtn img.h{position:absolute;left:0;top:0;opacity:0}
  .imgbtn:hover img.h,.imgbtn:focus-visible img.h,.imgbtn.done img.h{opacity:1}
  .imgbtn:hover img.n,.imgbtn:focus-visible img.n,.imgbtn.done img.n{opacity:0}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
  .ld-foot{
    position:absolute;left:0;right:0;bottom:clamp(16px,4vh,40px);margin:0;padding:0 24px;
    text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    text-shadow:var(--glow);opacity:.85;animation:fadeUp 1.2s ease 1.1s both;
  }
  .ld-spark{
    position:absolute;right:clamp(28px,5vw,96px);bottom:clamp(28px,5vw,80px);
    width:clamp(56px,5.4vw,96px);height:auto;pointer-events:none;
    filter:drop-shadow(0 0 12px rgba(255,210,215,.9));
    animation:spin 18s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 点了 ENTER：标题往前一冲、散掉，整层淡出 */
  #landing.leaving .ld-title{animation:titleOut 1s cubic-bezier(.5,0,.2,1) forwards}
  #landing.leaving .ld-enter,#landing.leaving .ld-foot{transition:opacity .4s;opacity:0}
  @keyframes titleOut{to{opacity:0;transform:scale(1.12);filter:blur(14px)}}

  /* ---------------------------------------------------------- 拍照预览 */
  #flash{position:fixed;inset:0;z-index:80;background:#fff;opacity:0;pointer-events:none}
  #flash.pop{animation:flash .55s ease-out}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}

  #photo{
    position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px 16px;
    background:rgba(214,204,220,.42);
    -webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);
    opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s;
  }
  #photo.open{opacity:1;visibility:visible}
  .ph-card{
    display:flex;flex-direction:column;align-items:center;gap:18px;max-width:100%;
    transform:translateY(16px) scale(.97);transition:transform .45s cubic-bezier(.2,.7,.2,1);
  }
  #photo.open .ph-card{transform:none}
  .ph-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:100%;
    text-shadow:var(--glow);
  }
  .ph-head .t{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1}
  .ph-head .x{width:30px;height:30px}
  /* 照片装在一张白边相纸里，底下留一条写日期 */
  .ph-frame{
    margin:0;padding:12px 12px 0;background:#FBF8F7;border-radius:4px;
    box-shadow:0 30px 70px rgba(60,48,90,.28),0 2px 8px rgba(60,48,90,.12);
    transform:rotate(-.6deg);
  }
  .ph-frame img{
    display:block;max-width:min(1100px,86vw);max-height:62vh;width:auto;height:auto;
    background:var(--lav);
  }
  .ph-frame figcaption{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:12px 4px 13px;color:var(--ink);
  }
  .ph-frame .ph-brand{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.04em;color:var(--coral-deep)}
  .ph-frame .ph-date{font-size:11px;letter-spacing:.16em;color:var(--blue)}
  /* 三张按钮图四周自带一大圈光晕，彼此靠拢一点，看起来才是一组 */
  .ph-actions{display:flex;gap:0;flex-wrap:wrap;justify-content:center;margin-top:-18px}
  .ph-actions .imgbtn{width:clamp(170px,14vw,240px);margin:0 -18px}
  .ph-actions button[hidden]{display:none}

  @media (prefers-reduced-motion:reduce){
    .ld-ring,.ld-spark,.ld-title{animation:none!important}
  }

  @media (max-width:900px){
    #ui{width:calc(100vw - 28px);top:auto;bottom:12px;right:14px;left:14px;max-height:52vh}
    /* 窄屏上面板本来就压着整个下半屏，两个角落都没地方站 */
    #bottomleft{display:none}
    #tools{top:14px;right:14px}
    #help{top:auto;bottom:12px;right:14px;left:14px;width:auto;max-height:52vh}
    #ui header,#help .t{padding-right:24px}
    #stats{font-size:10px;letter-spacing:.1em}
    .ph-frame img{max-height:54vh}
  }
</style>
</head>
<body class="landing">

<div id="topleft">
  <div class="sub" data-i18n="brand.sub">Realtime Snow · WebGPU</div>
  <div id="stats">— fps</div>
</div>

<div id="bottomleft">
  <div id="brand"><img src="assets/title.png" alt="Snow Day" width="1660" height="688" /></div>
</div>

<div id="tools">
  <button id="helpbtn" class="toolbtn" data-tool="help" data-i18n-title="hint.toggle"><img src="assets/UI/control.png" alt="" /></button>
  <button id="shotbtn" class="toolbtn" data-tool="photo" data-i18n-title="hint.photo"><img src="assets/UI/camera.png" alt="" /></button>
  <button id="panelbtn" class="toolbtn" data-tool="panel" data-i18n-title="panel.toggle"><img src="assets/UI/snow.png" alt="" /></button>
</div>

<div id="help" class="hidden">
  <div class="t" data-i18n="hint.show">Controls</div>
  <div id="hint" data-i18n="hint.html"></div>
</div>

<div id="ui">
  <header>
    <div class="t" data-i18n="panel.title">Control</div>
    <div class="hbtns">
      <button class="iconbtn langbtn" id="langbtn" data-i18n-title="panel.lang">EN</button>
    </div>
  </header>
  <div class="body" id="uibody"><!-- 由 ui.js 生成 --></div>
</div>

<!-- 落地页：场景加载完之后停在这里，点 ENTER 才进去玩 -->
<div id="landing">
  <div class="ld-veil"></div>
  <div class="ld-ring r1"></div>
  <div class="ld-ring r2"></div>
  <div class="ld-center">
    <div class="ld-tilt" id="ldtilt">
      <img class="ld-title" id="ldtitle" src="assets/title.png" alt="Snow Day" width="1660" height="688" draggable="false" />
    </div>
    <button id="enterbtn" class="ld-enter imgbtn" data-i18n-title="land.enter" aria-label="Enter">
      <img class="n" src="assets/UI/enter.png" alt="" width="771" height="307" />
      <img class="h" src="assets/UI/enter-hover.png" alt="" width="771" height="307" />
    </button>
  </div>
  <p class="ld-foot" data-i18n="land.foot"></p>
  <img class="ld-spark" src="assets/snow.png" alt="" width="123" height="119" />
</div>

<!-- 拍照预览 -->
<div id="flash"></div>
<div id="photo" role="dialog" aria-modal="true" aria-labelledby="phtitle">
  <div class="ph-card">
    <div class="ph-head">
      <div class="t" id="phtitle" data-i18n="shot.title">Snapshot</div>
    </div>
    <figure class="ph-frame">
      <img id="phimg" alt="" />
      <figcaption><span class="ph-brand">Snow Day</span><span class="ph-date" id="phdate"></span></figcaption>
    </figure>
    <div class="ph-actions">
      <button id="phsave" class="imgbtn" data-i18n-title="shot.save" aria-label="Save">
        <img class="n" src="assets/UI/save.png" alt="" width="771" height="307" />
        <img class="h" src="assets/UI/save-hover.png" alt="" width="771" height="307" />
      </button>
      <button id="phshare" class="imgbtn" data-i18n-title="shot.share" aria-label="Share" hidden>
        <img class="n" src="assets/UI/share.png" alt="" width="771" height="307" />
        <img class="h" src="assets/UI/share-hover.png" alt="" width="771" height="307" />
      </button>
      <button id="phclose" class="imgbtn" data-i18n-title="shot.again" aria-label="Back">
        <img class="n" src="assets/UI/back.png" alt="" width="771" height="307" />
        <img class="h" src="assets/UI/back-hover.png" alt="" width="771" height="307" />
      </button>
    </div>
  </div>
</div>

<div id="boot">
  <h1 class="sr" data-i18n="brand.name">Snow Day</h1>
  <p class="blurb" data-i18n="brand.blurb"></p>
  <p class="tip" data-i18n="boot.tip"></p>
  <div class="bar"><i></i></div>
  <div class="err" id="booterr"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
