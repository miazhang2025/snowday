<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snow Day · Build a Snowman — WebGPU</title>
<meta name="description" content="A quiet place to play in the snow. Push it around by hand, press snowmen and castle walls out of molds, leave tracks across a winter valley — live on WebGPU." />
<meta name="theme-color" content="#18191C" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Snow Day · Build a Snowman" />
<meta property="og:description" content="A quiet place to play in the snow. Press snowmen, towers and castle walls out of molds and leave tracks across a winter valley — running live on WebGPU." />
<meta property="og:image" content="/assets/og-image.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1920" />
<meta property="og:image:height" content="1080" />
<meta property="og:image:alt" content="A snow-covered valley at dusk with pines, rocks and a drift of packed snow, under the words Comrade Noise." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="/assets/og-image.jpg" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Vina+Sans&display=swap" rel="stylesheet" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<style>
  :root{
    --red:#A32100;
    --paper:#DBDBD2;
    --blue:#214AA2;
    --ink:#18191C;

    --mono:'Anonymous Pro', ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', 'Microsoft YaHei', monospace;
    --display:'Vina Sans', 'Anonymous Pro', 'PingFang SC', 'Microsoft YaHei', sans-serif;

    --line:rgba(24,25,28,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--ink);overflow:hidden;
    font-family:var(--mono);font-size:12px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:none}

  /* ---------------------------------------------------------- 纸片 */
  .chip{
    display:block;width:fit-content;max-width:100%;
    background:rgba(219,219,210,.92);color:var(--ink);
    font-family:var(--mono);font-size:11px;letter-spacing:.13em;
    text-transform:uppercase;padding:5px 10px 4px;
  }

  /* ---------------------------------------------------------- 左上 */
  #topleft{
    position:fixed;left:22px;top:20px;z-index:20;pointer-events:none;
    display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  }
  #stats{font-variant-numeric:tabular-nums}

  /* ---------------------------------------------------------- 左下 */
  #bottomleft{
    position:fixed;left:22px;bottom:18px;z-index:20;pointer-events:none;
    display:flex;flex-direction:column;align-items:flex-start;gap:9px;
    max-width:min(780px,64vw);
  }
  /* ---------------------------------------------------------- 右下 */
  /* 控制面板占满了右边一整条，所以这里默认往左让开它 326px + 12px 的间距；
     面板收起时（body.panel-hidden 由 ui.js 打上）再贴回最右边。
     让位用 transform 而不是 right：right 每帧都要重排，而这个页面的主线程
     一直被渲染循环占着，掉帧时那段动画会一卡一卡的；transform 走合成器，
     不碰布局。命中区域跟着 transform 走，按钮照样点得到。 */
  #bottomright{
    position:fixed;right:18px;bottom:18px;z-index:20;pointer-events:none;
    display:flex;flex-direction:column;align-items:flex-end;gap:9px;
    max-width:min(760px,52vw);
    transform:translateX(-338px);
    transition:transform .38s cubic-bezier(.4,0,.2,1);
  }
  body.panel-hidden #bottomright{transform:none}

  #hintwrap{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .cornerbtns{display:flex;gap:6px}
  .cornerbtn{
    pointer-events:auto;cursor:pointer;border:1px solid var(--ink);
    background:rgba(219,219,210,.92);color:var(--ink);
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;padding:4px 9px 3px;line-height:1.2;white-space:nowrap;
  }
  .cornerbtn:hover{background:var(--paper);border-color:var(--red);color:var(--red)}
  .cornerbtn.on{background:var(--paper);border-color:var(--red);color:var(--red)}
  #hint{
    letter-spacing:.06em;line-height:1.72;text-transform:none;
    padding:8px 12px 7px;transition:opacity .3s;
  }
  #hintwrap.collapsed #hint{display:none}
  #hint em{font-style:normal;font-weight:700;text-transform:uppercase;letter-spacing:.11em}
  #hint kbd{
    display:inline-block;min-width:15px;text-align:center;padding:0 4px;margin:0 1px;
    border:1px solid var(--line);font-family:var(--mono);font-size:10px;
  }
  #brand b{
    display:block;font-family:var(--display);font-weight:400;
    font-size:clamp(46px,6.2vw,96px);line-height:.84;letter-spacing:.015em;
    white-space:nowrap;color:var(--red);text-transform:uppercase;
    text-shadow:0 2px 20px rgba(24,25,28,.28);
  }

  /* ---------------------------------------------------------- 控制面板 */
  #ui{
    position:fixed;right:18px;top:18px;bottom:18px;width:326px;z-index:30;
    display:flex;flex-direction:column;
    background:var(--paper);border-radius:18px;
    box-shadow:0 20px 54px rgba(24,25,28,.30), 0 2px 10px rgba(24,25,28,.16);
    transition:transform .38s cubic-bezier(.4,0,.2,1),opacity .3s;
  }
  #ui.hidden{transform:translateX(calc(100% + 30px));opacity:0}
  #ui header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 8px;flex:none;
  }
  #ui header .t{
    font-family:var(--display);font-size:34px;line-height:.9;letter-spacing:.045em;
    color:var(--ink);text-transform:uppercase;
  }
  .hbtns{display:flex;align-items:center;gap:6px}

  #ui .body{overflow-y:auto;overscroll-behavior:contain;padding:0 18px 18px;flex:1}
  #ui .body::-webkit-scrollbar{width:5px}
  #ui .body::-webkit-scrollbar-thumb{background:rgba(24,25,28,.28)}
  #ui .body::-webkit-scrollbar-track{background:transparent}

  /* ---------------------------------------------------------- 分组 */
  .grp{margin-top:16px}
  .grp:first-child{margin-top:2px}
  .grp>h3{
    margin:0 0 7px;padding-bottom:4px;
    font-family:var(--mono);font-size:12px;font-weight:700;
    letter-spacing:.17em;text-transform:uppercase;color:var(--ink);
    border-bottom:1.5px solid var(--red);
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    cursor:pointer;user-select:none;
  }
  .grp>h3:hover{color:var(--red)}
  .grp>h3:focus-visible{outline:1px solid var(--red);outline-offset:2px}
  .grp>h3 .caret{
    font-style:normal;font-size:9px;letter-spacing:0;opacity:.45;
    transition:transform .18s;transform-origin:50% 45%;
  }
  .grp>h3:hover .caret{opacity:.9}
  /* 收起时只留标题，底边距一并收掉，免得留一条空档 */
  .grp.collapsed>h3{margin-bottom:0}
  .grp.collapsed>h3 .caret{transform:rotate(-90deg)}
  .grp.collapsed>*:not(h3){display:none}

  /* ---------------------------------------------------------- 滑杆 */
  .row{margin-bottom:9px}
  .row .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .row .lbl span{
    color:var(--blue);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row .lbl b{
    color:var(--blue);font-weight:400;font-size:11px;letter-spacing:.06em;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:13px;
    background:transparent;cursor:pointer;margin:1px 0 0;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
  input[type=range]::-moz-range-track{height:1px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:8px;height:8px;margin-top:-3.5px;
    background:var(--ink);border:0;border-radius:0;transition:transform .12s;
  }
  input[type=range]::-moz-range-thumb{
    width:8px;height:8px;border:0;border-radius:0;background:var(--ink);
  }
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.35)}
  input[type=range]:focus-visible{outline:1px solid var(--red);outline-offset:3px}

  /* ---------------------------------------------------------- 按钮 */
  .btns{display:grid;grid-template-columns:repeat(3,1fr)}
  .btns.two{grid-template-columns:repeat(2,1fr)}
  .btns button + button{margin-left:-1px}
  /* 折行的按钮组（手势 4 个、模具 6 个）：行与行之间也要并边框，
     而且每行第一个不能再往左缩，否则会顶出网格 */
  .btns.two button:nth-child(2n+1){margin-left:0}
  .btns.two button:nth-child(n+3){margin-top:-1px}
  .btns.grid6 button:nth-child(3n+1){margin-left:0}
  .btns.grid6 button:nth-child(n+4){margin-top:-1px}
  button{
    font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--ink);background:transparent;border:1px solid var(--line);
    border-radius:0;padding:9px 3px 8px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  button:hover{background:rgba(24,25,28,.06)}
  button.on{
    border-color:var(--red);background:rgba(163,33,0,.11);color:var(--ink);
    position:relative;z-index:1;
  }
  button .k{
    display:block;font-size:9px;letter-spacing:.1em;margin-top:3px;
    color:rgba(24,25,28,.42);
  }
  button.on .k{color:rgba(163,33,0,.72)}

  .iconbtn{
    width:26px;height:26px;padding:0;display:grid;place-items:center;
    font-size:12px;line-height:1;border:1px solid var(--ink);color:var(--ink);
  }
  .langbtn{width:auto;min-width:40px;padding:0 8px;font-size:10px;letter-spacing:.1em}

  #showui{
    position:fixed;right:18px;top:18px;z-index:29;display:none;
    background:var(--paper);border:1px solid var(--ink);
    width:34px;height:34px;
  }
  #showui.show{display:grid;place-items:center}

  /* ---------------------------------------------------------- 载入 */
  #boot{
    position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;background:var(--ink);
    transition:opacity .7s ease, visibility .7s;
  }
  #boot.done{opacity:0;visibility:hidden}
  #boot h1{
    margin:0;padding:0 24px;text-align:center;
    font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,68px);line-height:.92;
    letter-spacing:.05em;color:var(--paper);text-transform:uppercase;
  }
  #boot p{
    margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(219,219,210,.55);
  }
  /* 一句话说清这是个什么地方 —— 加载那几秒是唯一有人会读字的时候 */
  #boot .blurb{
    max-width:480px;padding:0 24px;text-align:center;
    font-size:13px;line-height:1.9;letter-spacing:.03em;
    text-transform:none;color:rgba(219,219,210,.74);
  }
  .bar{width:196px;height:2px;background:rgba(219,219,210,.16);overflow:hidden}
  .bar i{display:block;height:100%;width:34%;background:var(--red);animation:sweep 1.15s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
  #boot .err{
    display:none;max-width:520px;text-align:center;color:#E8A08C;
    font-family:var(--mono);font-size:12px;line-height:1.9;letter-spacing:.04em;text-transform:none;
  }
  /* 出错的时候只留报错，别让宣传语抢戏 */
  #boot.failed .bar,#boot.failed p.tip,#boot.failed .blurb{display:none}
  #boot.failed .err{display:block}

  @media (max-width:900px){
    #ui{width:calc(100vw - 28px);top:auto;bottom:12px;right:14px;left:14px;max-height:52vh}
    /* 窄屏上面板本来就压着整个下半屏，两个角落都没地方站 */
    #bottomleft,#bottomright{display:none}

  }
</style>
</head>
<body>

<div id="topleft">
  <div class="chip" data-i18n="brand.sub">Realtime Snow · WebGPU + TSL</div>
  <div class="chip" id="stats">— fps</div>
</div>

<div id="bottomleft">
  <div id="brand"><b data-i18n="brand.name">Comrade Noise</b></div>
</div>

<div id="bottomright">
  <div id="hintwrap">
    <div class="cornerbtns">
      <button id="shotbtn" class="cornerbtn" data-i18n-title="hint.photo"></button>
      <button id="hinttoggle" class="cornerbtn" data-i18n-title="hint.toggle">?</button>
    </div>
    <div class="chip" id="hint" data-i18n="hint.html"></div>
  </div>
</div>

<button id="showui" class="iconbtn" data-i18n-title="panel.show">☰</button>

<div id="ui">
  <header>
    <div class="t" data-i18n="panel.title">Control</div>
    <div class="hbtns">
      <button class="iconbtn langbtn" id="langbtn" data-i18n-title="panel.lang">EN</button>
      <button class="iconbtn" id="hideui" data-i18n-title="panel.hide">✕</button>
    </div>
  </header>
  <div class="body" id="uibody"><!-- 由 ui.js 生成 --></div>
</div>

<div id="boot">
  <h1 data-i18n="brand.name">Comrade Noise</h1>
  <p class="blurb" data-i18n="brand.blurb"></p>
  <p class="tip" data-i18n="boot.tip"></p>
  <div class="bar"><i></i></div>
  <div class="err" id="booterr"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
